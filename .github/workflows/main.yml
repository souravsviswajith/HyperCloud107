name: Cloud107 Main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud107-main-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npx prettier --check .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  local-runtime:
    name: Verify Local Runtime
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Build application
        run: npm run build

      - name: Start local API
        run: |
          C107_HOST=127.0.0.1 \
          C107_PORT=3000 \
          NODE_ENV=production \
          node dist/server.cjs > cloud107.log 2>&1 &
          echo $! > cloud107.pid

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health; then
              echo
              exit 0
            fi
            sleep 1
          done

          cat cloud107.log
          exit 1

      - name: Runtime health check
        run: curl --fail --show-error http://127.0.0.1:3000/api/v1/health

      - name: Stop local API
        if: always()
        run: |
          if [ -f cloud107.pid ]; then
            kill "$(cat cloud107.pid)" || true
          fi

      - name: Runtime logs
        if: always()
        run: cat cloud107.log || true
